name: social-network-production
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_network"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: social-network:production
    build:
      context: .
      target: production
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: social_network
      PGUSER: social
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

